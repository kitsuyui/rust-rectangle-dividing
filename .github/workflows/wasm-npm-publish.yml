name: wasm

on:
  pull_request:
    types: [opened, synchronize, reopened]
  release:
    # "released" events are emitted either when directly be released or be edited from pre-released.
    types: [prereleased, released]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Use git tag when release, otherwise use commit hash.
  VERSION: ${{ (github.event_name == 'release' && !github.event.release.prerelease) && github.ref_name || github.sha }}

permissions:
  contents: read
  id-token: write

jobs:
  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Check package metadata helper
        run: shellcheck update-package-json.sh

  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Install wasm-pack
        env:
          WASM_PACK_VERSION: "0.14.0"
        run: |
          curl -fsSL \
            "https://github.com/wasm-bindgen/wasm-pack/releases/download/v${WASM_PACK_VERSION}/wasm-pack-v${WASM_PACK_VERSION}-x86_64-unknown-linux-musl.tar.gz" \
            -o wasm-pack.tar.gz
          tar -xzf wasm-pack.tar.gz
          sudo mv "wasm-pack-v${WASM_PACK_VERSION}-x86_64-unknown-linux-musl/wasm-pack" /usr/local/bin/wasm-pack
          wasm-pack --version

      - run: |
          # wasm-pack test --node --firefox --chrome --safari --headless
          wasm-pack build --release --target bundler --scope kitsuyui
          ./update-package-json.sh
          wasm-pack pack

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: '24.x'
          registry-url: 'https://registry.npmjs.org'

      - name: Verify Node and npm versions for trusted publishing
        run: |
          node -e "const [a,b]=process.versions.node.split('.').map(Number); if (a < 22 || (a === 22 && b < 14)) process.exit(1)"
          node -e "const [a,b,c]=require('child_process').execFileSync('npm',['--version'],{encoding:'utf8'}).trim().split('.').map(Number); if (a < 11 || (a === 11 && (b < 5 || (b === 5 && c < 1)))) process.exit(1)"

      - name: Create tarball
        run: tar -czf pkg.tar.gz pkg

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wasm-${{ env.VERSION }}
          path: ./pkg.tar.gz
          retention-days: 1

      - name: publish
        if: github.event_name == 'release' && !github.event.release.prerelease
        env:
          EXPECTED_TAG: ${{ github.ref_name }}
        run: |
          test "v$(node -p "require('./pkg/package.json').version")" = "$EXPECTED_TAG"
          wasm-pack publish --access public
